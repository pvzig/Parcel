name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build, test, and format
    runs-on: ubuntu-latest
    container: >-
      swiftlang/swift:nightly-6.4.x-noble@sha256:dc0323c7520b054912489c562e81e101308b3199e8c2ac516ef16f7a47d7e202
    env:
      PARCEL_INCLUDE_WASM_TESTS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Format lint
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

      - name: Build
        run: swift build --scratch-path .build-ci-build

      - name: Test
        run: swift test --parallel --scratch-path .build-ci-tests

  wasm:
    name: Wasm browser tests
    runs-on: ubuntu-latest
    container: >-
      swiftlang/swift:nightly-6.4.x-noble@sha256:dc0323c7520b054912489c562e81e101308b3199e8c2ac516ef16f7a47d7e202
    env:
      HTTP_API_ENABLE_WASM: "1"
      PARCEL_INCLUDE_WASM_TESTS: "1"
      PARCEL_SWIFT_SDK: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm
      PARCEL_SWIFT_SDK_CHECKSUM: 11fabfac6804222569d330fbbb5fa34eef736abda46790e723ac73b256fd1c7a
      PARCEL_SWIFT_SDK_URL: >-
        https://download.swift.org/swift-6.4.x-branch/wasm-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm.artifactbundle.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Swift SDK
        run: swift sdk install "$PARCEL_SWIFT_SDK_URL" --checksum "$PARCEL_SWIFT_SDK_CHECKSUM"

      - name: Verify Swift SDK
        run: swift sdk list | grep -Fx "$PARCEL_SWIFT_SDK"

      - name: Resolve dependencies
        run: swift package --scratch-path .build resolve

      - name: Point PackageToJS at the vendored browser_wasi_shim
        run: |
          template_path=".build/checkouts/JavaScriptKit/Plugins/PackageToJS/Templates/package.json"
          chmod u+w "$template_path"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const shim = process.argv[2];
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.dependencies["@bjorn3/browser_wasi_shim"] = `file:${shim}`;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$template_path" "$PWD/Vendor/browser_wasi_shim"

      - name: Test
        run: |
          rm -rf \
            .build/plugins/PackageToJS/outputs/PackageTests \
            .build/plugins/PackageToJS/outputs/PackageTests.tmp
          swift package --scratch-path .build --swift-sdk "$PARCEL_SWIFT_SDK" js test \
            --default-platform node --prelude ./Tests/prelude.mjs -Xnode --expose-gc
